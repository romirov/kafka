spring:
  application:
    name: Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      producer: pTopic
      consumer: cTopic
      table: sStoreMsgTopic
    producer:
      acks: all
    consumer:
      group-id: test
      auto-offset-reset: earliest
      enable-auto-commit: true
    streams:
      application-id: test